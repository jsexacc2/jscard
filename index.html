<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Generator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Pusab';
            src: url('pusab.otf') format('opentype');
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #121212;
            color: white;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .controls input[type="text"], .controls select, .controls textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .toggle-row input[type="checkbox"] {
            transform: scale(1.5);
            margin-right: 10px;
        }
        .controls button {
            width: 100%;
            padding: 15px;
            background: #00ff66;
            color: black;
            font-weight: bold;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .card-wrapper {
            transform: scale(0.42);
            transform-origin: top center;
            height: 480px; 
        }

        .card {
            width: 825px;
            height: 1125px;
            padding: 25px;
            font-size: 40px;
            color: #000000;
            border: 6px solid #e0e0e0;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            font-family: "Montserrat", sans-serif;
            position: relative;
            z-index: 1;
            overflow: hidden;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
            background: #ffffff;
            box-sizing: border-box;
        }

        .header {
            background: linear-gradient(to bottom, rgba(30,30,30,0.85), rgba(10,10,10,0.95));
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #FFFFFF;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .card-title {
            font-family: "Pusab", "Arial Black", sans-serif;
            font-size: 60px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            white-space: nowrap; 
        }

        .card-creator {
            font-family: "Montserrat", sans-serif;
            font-size: 32px;
            font-weight: 500;
            margin-top: -2px;
            white-space: nowrap;
        }

        .art {
            height: 600px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #FFFFFF;
            flex: 1;
            background: #000;
        }

        .art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .description-box {
            background: linear-gradient(to bottom, rgba(15,15,15,0.85), rgba(25,25,25,0.9));
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            padding: 18px 25px 15px 25px;
            display: flex;
            flex-direction: column;
        }

        .description-text {
            font-family: "Montserrat", sans-serif;
            color: #FFFFFF;
            font-size: 40px;
            padding: 8px;
            text-align: center;
            font-style: italic;
            margin-bottom: 20px;
        }

        .card-footer-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 8px;
            color: #dddddd;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-normal { font-size: 28px; }
        .footer-foil { font-size: 20px; display: none; }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-direction: row;
        }

        .rnbw {
            background-image: linear-gradient(80deg, rgb(255, 100, 100), rgb(255, 217, 0), rgb(0, 255, 128), rgb(0, 191, 255), rgb(255, 0, 255));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-size: 28px;
            font-weight: 1000;
        }

        .holo-foil {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 8;
            pointer-events: none;
            mix-blend-mode: overlay;
            background: linear-gradient(80deg, transparent 10%, rgba(255,255,255, 0.9) 35%, transparent 50%);
            display: none; 
        }

        [class^="rarity-"] {
            font-weight: 700;
            font-size: 28px;
        }

        .rarity-common { color: #ffffff; }
        .rarity-uncommon { color: #66ff66; }
        .rarity-rare { color: #4488ff; }
        .rarity-epic { color: #bf59ff; }
        .rarity-legendary { color: #ffcc00; }
        .rarity-mythic { color: #ff3333; }
        .rarity-heavenly { color: #86fcb8; }
    </style>
</head>
<body>

    <div class="controls">
        <label>Level ID</label>
        <input type="text" id="input-id" value="10101010" oninput="updateCard()">
        
        <label>Card Name</label>
        <input type="text" id="input-name" value="RNBWCOMET" oninput="updateCard()">
        
        <label>Creator</label>
        <input type="text" id="input-creator" value="JollySpider" oninput="updateCard()">
        
        <label>Description</label>
        <textarea id="input-desc" rows="3" oninput="updateCard()">"Really Jolly, more rainbow-slop?"</textarea>
        
        <label>Rarity</label>
        <select id="input-rarity" onchange="updateCard()">
            <option value="common">Common</option>
            <option value="uncommon">Uncommon</option>
            <option value="rare">Rare</option>
            <option value="epic">Epic</option>
            <option value="legendary">Legendary</option>
            <option value="mythic" selected>Mythic</option>
            <option value="heavenly">Heavenly</option>
        </select>

        <div class="toggle-row">
            <label for="input-foil">Enable Foil Version</label>
            <input type="checkbox" id="input-foil" onchange="updateCard()">
        </div>

        <button id="dl-btn" onclick="downloadCard()">Download Card PNG</button>
    </div>

    <div class="card-wrapper">
        <div class="card" id="trading-card">
            <div class="holo-foil" id="card-holo"></div>
            
            <div class="header">
                <span class="card-title" id="card-name">RNBWCOMET</span>
                <span class="card-creator" id="card-creator">By JollySpider</span>
            </div>
            
            <div class="art">
                <img src="https://levelthumbs.prevter.me/thumbnail/10101010" id="card-art" crossorigin="anonymous" />
            </div>
            
            <div class="description-box">
                <div class="description-text" id="card-desc">"Really Jolly, more rainbow-slop?"</div>
                
                <div class="card-footer-line footer-normal" id="footer-normal">
                    <span>Jolly's Level Cards</span>
                    <span class="rarity-mythic card-rarity">Mythic</span>
                </div>

                <div class="card-footer-line footer-foil" id="footer-foil">
                    <span>JOLLY'S LEVEL CARDS</span>
                    <div class="footer-right">
                        <span class="rarity-mythic card-rarity">Mythic</span>
                        <span>&</span>
                        <span class="rnbw">RNBW</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateCard() {
            const id = document.getElementById('input-id').value;
            const name = document.getElementById('input-name').value;
            const creator = document.getElementById('input-creator').value;
            const desc = document.getElementById('input-desc').value;
            const rarity = document.getElementById('input-rarity').value;
            const isFoil = document.getElementById('input-foil').checked;

            document.getElementById('card-name').innerText = name;
            document.getElementById('card-creator').innerText = "By " + creator;
            document.getElementById('card-desc').innerText = desc;
            
            const formattedRarity = rarity.charAt(0).toUpperCase() + rarity.slice(1);
            const raritySpans = document.querySelectorAll('.card-rarity');
            raritySpans.forEach(span => {
                span.className = "rarity-" + rarity + " card-rarity";
                span.innerText = formattedRarity;
            });

            const thumbUrl = `https://levelthumbs.prevter.me/thumbnail/${id}`;
            document.getElementById('card-art').src = thumbUrl;

            document.getElementById('card-holo').style.display = isFoil ? 'block' : 'none';
            document.getElementById('footer-foil').style.display = isFoil ? 'flex' : 'none';
            document.getElementById('footer-normal').style.display = isFoil ? 'none' : 'flex';
        }

        async function downloadCard() {
            const name = document.getElementById('input-name').value || 'card';
            const btn = document.getElementById('dl-btn');
            const id = document.getElementById('input-id').value;
            const title = document.getElementById('card-name').innerText;
            const creator = document.getElementById('card-creator').innerText;
            const desc = document.getElementById('card-desc').innerText;
            const rarityText = document.querySelector('.card-rarity').innerText;
            const isFoil = document.getElementById('input-foil').checked;

            btn.innerText = "Generating PNG...";
            btn.disabled = true;

            await document.fonts.ready;

            const canvas = document.createElement('canvas');
            canvas.width = 825;
            canvas.height = 1125;
            const ctx = canvas.getContext('2d');

            // 1. Draw Card Background Base
            ctx.fillStyle = "#ffffff";
            ctx.roundRect(0, 0, 825, 1125, 20);
            ctx.fill();
            ctx.lineWidth = 12;
            ctx.strokeStyle = "#e0e0e0";
            ctx.stroke();

            // 2. Load Thumbnail Image safely
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = `https://levelthumbs.prevter.me/thumbnail/${id}`;
            
            await new Promise((resolve) => {
                img.onload = resolve;
                img.onerror = resolve; // fallback if image fails
            });

            // Draw Art Box
            ctx.fillStyle = "#000000";
            ctx.fillRect(25, 205, 775, 600);
            try {
                ctx.drawImage(img, 25, 205, 775, 600);
            } catch(e) {}

            // 3. Draw Header Box
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(25, 25, 775, 170);
            
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 55px 'Pusab', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(title, 412, 100);

            ctx.font = "500 28px 'Montserrat', sans-serif";
            ctx.fillText(creator, 412, 145);

            // 4. Draw Description Box
            ctx.fillStyle = "#141414";
            ctx.fillRect(25, 815, 775, 285);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "italic 36px 'Montserrat', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(desc, 412, 890);

            // 5. Draw Footer Line
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(55, 980);
            ctx.lineTo(770, 980);
            ctx.stroke();

            ctx.font = "700 26px 'Montserrat', sans-serif";
            ctx.textAlign = "left";
            ctx.fillStyle = "#dddddd";
            ctx.fillText(isFoil ? "JOLLY'S LEVEL CARDS" : "Jolly's Level Cards", 55, 1030);

            ctx.textAlign = "right";
            ctx.fillStyle = "#ff3333";
            ctx.fillText(rarityText, 770, 1030);

            // Trigger direct download
            const link = document.createElement('a');
            link.download = name + '-card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();

            btn.innerText = "Download Card PNG";
            btn.disabled = false;
        }
    </script>
</body>
</html>
