<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Generator</title>
    
    <!-- html-to-image library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Pusab';
            src: url('pusab.otf') format('opentype');
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #121212;
            color: white;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .controls > label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-top: 12px;
            margin-bottom: 4px;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 12px;
            margin-bottom: 4px;
        }
        .label-row label {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
        }
        .hide-label {
            width: 44px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            margin: 0;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: stretch;
        }
        .input-row input[type="text"], 
        .input-row select, 
        .input-row textarea {
            flex: 1;
            padding: 10px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
            margin: 0;
            width: auto;
        }
        .input-row textarea {
            resize: vertical;
        }
        
        /* Fixed small red square clear button */
        .input-row .btn-clear-field {
            background: #ff4444 !important;
            color: white !important;
            border: none !important;
            border-radius: 6px !important;
            width: 38px !important;
            min-width: 38px !important;
            height: auto !important;
            font-family: inherit !important;
            font-weight: 900 !important;
            font-size: 16px !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            flex-shrink: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            transition: 0.15s ease !important;
        }
        .input-row .btn-clear-field:hover {
            background: #ff2222 !important;
        }

        .hide-box {
            width: 44px;
            background: #333;
            border: 1px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .hide-box input[type="checkbox"] {
            transform: scale(1.5);
            cursor: pointer;
            margin: 0;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0 8px 0;
            font-weight: bold;
            font-size: 14px;
        }
        .toggle-row input[type="checkbox"] {
            transform: scale(1.5);
            margin-right: 10px;
        }

        /* Restricted to direct children so it doesn't break small field buttons */
        .controls > button {
            width: 100%;
            padding: 15px;
            background: #00ff66;
            color: black;
            font-weight: bold;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-clear {
            background: #ff4444 !important;
            color: white !important;
            font-size: 15px !important;
            padding: 12px !important;
            margin-top: 6px !important;
        }
        
        .card-wrapper {
            transform: scale(0.42);
            transform-origin: top center;
            height: 480px; 
        }

        .card {
            width: 825px;
            height: 1125px;
            padding: 25px;
            font-size: 40px;
            color: #000000;
            border: 6px solid transparent;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            font-family: "Montserrat", sans-serif;
            position: relative;
            z-index: 1;
            overflow: hidden;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
            background: linear-gradient(white, white) padding-box, 
            linear-gradient(135deg, #ffffff, #c9c9c9) border-box;
            box-sizing: border-box;
        }

        .card-bg {
            content: "";
            position: absolute;
            top: -100%; left: -100%; right: -100%; bottom: -100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            filter: blur(35px) saturate(1.4) brightness(0.75);
            transform: rotate(calc(var(--seed, 1) * 47deg));
            transform-origin: center;
            backface-visibility: hidden; 
        }

        .card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 2000 2000' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.002' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-size: cover;
            mix-blend-mode: overlay; 
            opacity: 1;
            filter: contrast(150%) brightness(120%);
        }

        .header {
            background: linear-gradient(to bottom, rgba(30,30,30,0.6), rgba(10,10,10,0.6));
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #FFFFFF;
            height: 138px;
            padding: 25px 20px 21px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px; 
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            box-shadow: inset 0px 2px 4px rgba(255,255,255,0.2);
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .header.no-creator .card-creator {
            display: none !important;
        }
        .header.no-creator .card-title {
            font-size: 78px; 
        }

        .card-title {
            font-family: "Pusab", "Arial Black", sans-serif;
            font-size: 60px;
            letter-spacing: 1px;
            line-height: 1;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            white-space: nowrap; 
            transition: font-size 0.2s ease;
        }

        .card-creator {
            font-family: "Montserrat", sans-serif;
            font-size: 24px;
            line-height: 1;
            margin: 0;
            white-space: nowrap;
        }

        .art {
            height: 600px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #FFFFFF;
            box-shadow: 0px 6px 15px rgba(0,0,0,0.6);
            flex: 1;
        }

        .art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.15);
        }

        .description-box {
            background: linear-gradient(to bottom, rgba(15,15,15,0.6), rgba(25,25,25,0.6));
            backdrop-filter: brightness(1.2) blur(3px);
            -webkit-backdrop-filter: brightness(1.2) blur(3px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            padding: 32px 25px 20px 25px; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0px 4px 10px rgba(0,0,0,0.6);
        }

        .description-text {
            font-family: "Montserrat", sans-serif;
            color: #FFFFFF;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.9);
            font-size: 40px;
            padding: 0;
            margin: 0 0 25px 0;
            text-align: center;
            font-style: italic;
        }

        .card-footer-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 12px;
            color: #dddddd;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            box-sizing: border-box;
        }

        .footer-normal { font-size: 28px; }
        .footer-foil { font-size: 20px; display: none; }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-direction: row;
        }

        .rnbw {
            background-image: linear-gradient(80deg, rgb(255, 100, 100), rgb(255, 217, 0), rgb(0, 255, 128), rgb(0, 191, 255), rgb(255, 0, 255));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-size: 28px;
            font-weight: 1000;
        }

        .holo-foil {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 8;
            pointer-events: none;
            mix-blend-mode: overlay;
            opacity: 1;
            background: 
                linear-gradient(80deg, transparent 10%, rgba(255,255,255, 0.9) 35%, rgba(255,255,255, 0.9) 25%, transparent 50%),
                linear-gradient(80deg, rgba(255, 100, 100, 1), rgba(255, 215, 0, 1), rgba(0, 255, 128, 1), rgba(0, 191, 255, 1), rgba(255, 0, 255, 1)),
                url("holo.png"); 
            background-size: 100% 100%, 100% 100%, cover;
            background-blend-mode: normal, screen, normal;
            filter: saturate(250%);
            display: none; 
        }

        [class^="rarity-"] {
            position: relative;
            z-index: 1;
            font-family: "Montserrat", sans-serif;
            font-weight: 700;
            font-size: 28px;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.3);
        }

        [class^="rarity-"]::before {
            content: attr(data-text); 
            position: absolute;
            left: 0; top: 0; z-index: -1;
            -webkit-text-stroke: 2px CurrentColor;
            -webkit-filter: brightness(0.5);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        .rarity-common { color: #ffffff; }
        .rarity-uncommon { color: #66ff66; }
        .rarity-rare { color: #4488ff; }
        .rarity-epic { color: #bf59ff; }
        .rarity-legendary { color: #ffcc00; font-weight: bold; }
        .rarity-mythic { color: #ff3333; font-weight: bold; }
        .rarity-heavenly { color: #86fcb8; font-weight: bold; }
    </style>
</head>
<body>

    <div class="controls">
        <div class="toggle-row" style="margin-top: 0;">
            <label for="input-use-url" style="margin: 0; font-size: 14px;">Use Custom Image URL</label>
            <input type="checkbox" id="input-use-url" onchange="toggleInputMode()">
        </div>

        <div class="label-row">
            <label id="label-art-id">Level ID</label>
            <label id="label-art-url" style="display: none;">Custom Image URL</label>
            <span class="hide-label">Hide</span>
        </div>
        <div class="input-row">
            <input type="text" id="input-id" value="000000000" oninput="updateCard()">
            <input type="text" id="input-url" style="display: none;" placeholder="https://..." oninput="updateCard()">
            <button class="btn-clear-field" onclick="clearField('input-id'); clearField('input-url');" title="Clear Field">X</button>
            <div class="hide-box">
                <input type="checkbox" id="hide-art" onchange="updateCard()">
            </div>
        </div>
        
        <label>Card Name</label>
        <div class="input-row">
            <input type="text" id="input-name" value="LVLNAME" oninput="updateCard()">
            <button class="btn-clear-field" onclick="clearField('input-name')" title="Clear Field">X</button>
            <div class="hide-box">
                <input type="checkbox" id="hide-name" onchange="updateCard()">
            </div>
        </div>
        
        <label>Creator</label>
        <div class="input-row">
            <input type="text" id="input-creator" value="LVLCREATOR" oninput="updateCard()">
            <button class="btn-clear-field" onclick="clearField('input-creator')" title="Clear Field">X</button>
            <div class="hide-box">
                <input type="checkbox" id="hide-creator" onchange="updateCard()">
            </div>
        </div>
        
        <label>Description</label>
        <div class="input-row">
            <textarea id="input-desc" rows="3" oninput="updateCard()">CARDTEXT</textarea>
            <button class="btn-clear-field" onclick="clearField('input-desc')" title="Clear Field">X</button>
            <div class="hide-box">
                <input type="checkbox" id="hide-desc" onchange="updateCard()">
            </div>
        </div>
        
        <label>Rarity</label>
        <div class="input-row">
            <select id="input-rarity" onchange="updateCard()">
                <option value="common">Common</option>
                <option value="uncommon">Uncommon</option>
                <option value="rare">Rare</option>
                <option value="epic">Epic</option>
                <option value="legendary">Legendary</option>
                <option value="mythic" selected>Mythic</option>
                <option value="heavenly">Heavenly</option>
            </select>
            <button class="btn-clear-field" onclick="clearField('input-rarity')" title="Clear Field">X</button>
            <div class="hide-box">
                <input type="checkbox" id="hide-rarity" onchange="updateCard()">
            </div>
        </div>

        <div class="toggle-row">
            <label for="input-foil" style="margin: 0; font-size: 14px;">Enable Foil / RNBW Version</label>
            <input type="checkbox" id="input-foil" onchange="updateCard()">
        </div>

        <button id="dl-btn" onclick="downloadCard()">Download Card PNG</button>
        <button class="btn-clear" onclick="clearAllInputs()">Clear All Inputs</button>
    </div>

    <div class="card-wrapper">
        <div class="card" id="trading-card">
            <div class="card-bg" id="card-bg" style="background-image: url('https://levelthumbs.prevter.me/thumbnail/000000000'); --seed: 000000000;"></div>
            <div class="holo-foil" id="card-holo"></div>
            
            <div class="header">
                <span class="card-title" id="card-name">LVLNAME</span>
                <span class="card-creator" id="card-creator">By LVLCREATOR</span>
            </div>
            
            <div class="art">
                <img src="https://levelthumbs.prevter.me/thumbnail/000000000" id="card-art" alt="Card Art" crossorigin="anonymous" />
            </div>
            
            <div class="description-box">
                <div class="description-text" id="card-desc">CARDTEXT</div>
                
                <div class="card-footer-line footer-normal" id="footer-normal">
                    <span>Jolly's Level Cards</span>
                    <span class="rarity-mythic card-rarity" data-text="Mythic">Mythic</span>
                </div>

                <div class="card-footer-line footer-foil" id="footer-foil">
                    <span>JOLLY'S LEVEL CARDS</span>
                    <div class="footer-right">
                        <span class="rarity-mythic card-rarity" data-text="Mythic">Mythic</span>
                        <span>&</span>
                        <span class="rnbw">RNBW</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleInputMode() {
            const useUrl = document.getElementById('input-use-url').checked;
            document.getElementById('input-id').style.display = useUrl ? 'none' : 'block';
            document.getElementById('label-art-id').style.display = useUrl ? 'none' : 'block';
            
            document.getElementById('input-url').style.display = useUrl ? 'block' : 'none';
            document.getElementById('label-art-url').style.display = useUrl ? 'block' : 'none';
            
            updateCard();
        }

        function clearField(fieldId) {
            const field = document.getElementById(fieldId);
            if(field) {
                if(field.tagName === 'SELECT') {
                    field.value = 'common'; 
                } else {
                    field.value = '';
                }
                updateCard();
            }
        }

        function updateCard() {
            const useUrl = document.getElementById('input-use-url').checked;
            const id = document.getElementById('input-id').value;
            const urlInput = document.getElementById('input-url').value;
            
            const name = document.getElementById('input-name').value;
            const creator = document.getElementById('input-creator').value;
            const desc = document.getElementById('input-desc').value;
            const rarity = document.getElementById('input-rarity').value;
            const isFoil = document.getElementById('input-foil').checked;

            const hideArt = document.getElementById('hide-art').checked;
            const hideName = document.getElementById('hide-name').checked;
            const hideCreator = document.getElementById('hide-creator').checked;
            const hideDesc = document.getElementById('hide-desc').checked;
            const hideRarity = document.getElementById('hide-rarity').checked;

            document.getElementById('card-name').innerText = name || " ";
            document.getElementById('card-creator').innerText = "By " + (creator || " ");
            document.getElementById('card-desc').innerText = desc || " ";
            
            const formattedRarity = rarity ? (rarity.charAt(0).toUpperCase() + rarity.slice(1)) : 'Common';
            const raritySpans = document.querySelectorAll('.card-rarity');
            raritySpans.forEach(span => {
                span.className = "rarity-" + rarity + " card-rarity";
                span.innerText = formattedRarity;
                span.setAttribute('data-text', formattedRarity); 
            });

            let thumbUrl = '';
            if (useUrl) {
                thumbUrl = urlInput;
            } else {
                thumbUrl = id ? `https://levelthumbs.prevter.me/thumbnail/${id}` : '';
            }

            const bgElement = document.getElementById('card-bg');
            bgElement.style.backgroundImage = `url('${thumbUrl}')`;
            bgElement.style.setProperty('--seed', id || 1); 
            document.getElementById('card-art').src = thumbUrl;

            document.getElementById('card-holo').style.display = isFoil ? 'block' : 'none';
            document.getElementById('footer-foil').style.display = isFoil ? 'flex' : 'none';
            document.getElementById('footer-normal').style.display = isFoil ? 'none' : 'flex';

            document.querySelector('.art').style.visibility = hideArt ? 'hidden' : 'visible';
            document.getElementById('card-name').style.visibility = hideName ? 'hidden' : 'visible';
            document.getElementById('card-desc').style.visibility = hideDesc ? 'hidden' : 'visible';
            
            const headerElement = document.querySelector('.header');
            if (hideCreator) {
                headerElement.classList.add('no-creator');
            } else {
                headerElement.classList.remove('no-creator');
            }
            
            document.querySelectorAll('.card-rarity').forEach(el => el.style.visibility = hideRarity ? 'hidden' : 'visible');
            document.querySelectorAll('.footer-right span:not(.card-rarity)').forEach(el => el.style.visibility = hideRarity ? 'hidden' : 'visible');
        }
        
        function clearAllInputs() {
            document.getElementById('input-use-url').checked = false;
            document.getElementById('input-id').value = '';
            document.getElementById('input-url').value = '';
            document.getElementById('input-name').value = '';
            document.getElementById('input-creator').value = '';
            document.getElementById('input-desc').value = '';
            document.getElementById('input-rarity').value = 'common';
            document.getElementById('input-foil').checked = false;

            document.getElementById('hide-art').checked = false;
            document.getElementById('hide-name').checked = false;
            document.getElementById('hide-creator').checked = false;
            document.getElementById('hide-desc').checked = false;
            document.getElementById('hide-rarity').checked = false;

            toggleInputMode(); 
        }

        function downloadCard() {
            const cardElement = document.getElementById('trading-card');
            const wrapper = document.querySelector('.card-wrapper');
            const originalName = document.getElementById('input-name').value || 'card';
            const btn = document.getElementById('dl-btn');

            btn.innerText = "Rendering Card...";
            btn.disabled = true;

            document.fonts.ready.then(() => {
                wrapper.style.transform = 'scale(1)';
                wrapper.style.height = '1125px';

                setTimeout(() => {
                    htmlToImage.toPng(cardElement, { 
                        quality: 1.0, 
                        pixelRatio: 2, 
                        width: 825,    
                        height: 1125   
                    })
                    .then(function (dataUrl) {
                        wrapper.style.transform = 'scale(0.42)';
                        wrapper.style.height = '480px';

                        const link = document.createElement('a');
                        link.download = originalName + '.png';
                        link.href = dataUrl;
                        link.click();

                        btn.innerText = "Download Card PNG";
                        btn.disabled = false;
                    })
                    .catch(function (error) {
                        wrapper.style.transform = 'scale(0.42)';
                        wrapper.style.height = '480px';
                        alert("Export failed: " + error);
                        btn.innerText = "Download Card PNG";
                        btn.disabled = false;
                    });
                }, 150);
            });
        }
    </script>
</body>
</html>
