<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Generator</title>
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Pusab';
            src: url('pusab.otf') format('opentype');
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #121212;
            color: white;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; 
            box-sizing: border-box;
        }

        /* ----- Base / Mobile Layout ----- */
        .controls {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .control-col {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        
        .input-row input[type="text"], 
        .input-row select {
            flex: 1;
            padding: 10px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
            margin: 0;
            width: auto;
            height: 42px; 
        }
        
        .input-row .btn-clear-field {
            background: #ff4444 !important;
            color: white !important;
            border: none !important;
            border-radius: 6px !important;
            width: 42px !important;
            min-width: 42px !important;
            height: 42px !important;
            font-family: inherit !important;
            font-weight: 900 !important;
            font-size: 16px !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            flex-shrink: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            transition: 0.15s ease !important;
        }
        .input-row .btn-clear-field:hover {
            background: #ff2222 !important;
        }

        .hide-box {
            width: 42px;
            height: 42px;
            background: #333;
            border: 1px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        .hide-box input[type="checkbox"] {
            transform: scale(1.5);
            cursor: pointer;
            margin: 0;
        }

        .col-toggles {
            display: flex;
            flex-direction: column;
        }
        
        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 6px;
            margin: 4px 0;
            font-weight: bold;
            font-size: 14px;
        }
        .toggle-item input[type="checkbox"] {
            transform: scale(1.5);
            margin-right: 10px;
        }

        .col-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-dl {
            width: 100%;
            padding: 15px;
            background: #00ff66;
            color: black;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .action-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .action-row button {
            flex: 1;
            font-size: 15px !important;
            padding: 12px !important;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-clear { background: #ff4444; color: white; }
        .btn-import { background: #4488ff; color: white; }

        #overflow-warning {
            display: none;
            background: #ffaa00;
            color: #000;
            padding: 12px;
            border-radius: 6px;
            margin-top: 5px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
            border: 2px solid #cc8800;
        }
        
        /* Modal Popup Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            border: 2px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content h3 {
            margin: 0;
            font-size: 20px;
            text-align: center;
        }
        .modal-content textarea {
            width: 100%;
            background: #121212;
            color: #00ff66;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            font-size: 13px;
            box-sizing: border-box;
            resize: vertical;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-modal-submit { background: #4488ff; color: white; }
        .btn-modal-cancel { background: #555; color: white; }

        /* ----- PC Top Bar Layout Override ----- */
        @media (min-width: 1024px) {
            body {
                overflow: hidden;
                justify-content: flex-start;
                padding: 0;
            }
            .controls {
                flex-direction: row;
                width: 100%;
                max-width: none;
                border-radius: 0;
                padding: 15px 30px;
                margin-bottom: 0;
                background: #1a1a1a;
                border-bottom: 2px solid #000;
                gap: 25px;
                justify-content: center;
                align-items: flex-start; 
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                z-index: 10;
            }
            .control-col {
                flex: 1;
                max-width: 300px;
                gap: 10px;
                margin: 0;
            }
            .input-group label {
                margin-top: 0;
                margin-bottom: 6px;
            }
            .col-toggles {
                flex: 0 1 auto;
                flex-direction: row;
                gap: 25px;
                padding-top: 25px; 
            }
            .col-toggles .toggle-item {
                background: transparent;
                padding: 0;
                margin: 0;
                flex-direction: column;
                gap: 12px;
                align-items: center;
            }
            .col-toggles .toggle-item label {
                margin: 0;
            }
            .col-toggles .toggle-item input[type="checkbox"] {
                margin: 0;
                transform: scale(2.0);
            }
            .col-actions {
                flex: 1.2;
                max-width: 250px;
                justify-content: flex-start;
                margin-top: 15px; 
                gap: 10px;
            }
            .card-wrapper {
                margin-top: 4vh; 
                transform: scale(0.65);
                height: 731px; 
            }
        }

        /* ----- Card Layout Base ----- */
        .card-wrapper {
            transform-origin: top center;
        }
        
        @media (max-width: 1023px) {
            .card-wrapper {
                transform: scale(0.42);
                height: 480px; 
            }
        }

        .card {
            width: 825px;
            height: 1125px;
            padding: 25px;
            font-size: 40px;
            color: #000000;
            border: 6px solid transparent;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            font-family: "Montserrat", sans-serif;
            position: relative;
            z-index: 1;
            overflow: hidden;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
            background: linear-gradient(white, white) padding-box, 
            linear-gradient(135deg, #ffffff, #c9c9c9) border-box;
            box-sizing: border-box;
        }

        .card-bg {
            content: "";
            position: absolute;
            top: -100%; left: -100%; right: -100%; bottom: -100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            filter: blur(35px) saturate(1.4) brightness(0.75);
            transform: rotate(calc(var(--seed, 1) * 47deg));
            transform-origin: center;
            backface-visibility: hidden; 
        }

        .card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 2000 2000' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.002' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-size: cover;
            mix-blend-mode: overlay; 
            opacity: 1;
            filter: contrast(150%) brightness(120%);
        }

        .header {
            background: linear-gradient(to bottom, rgba(30,30,30,0.6), rgba(10,10,10,0.6));
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #FFFFFF;
            height: 138px;
            padding: 25px 20px 21px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0px; 
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            box-shadow: inset 0px 2px 4px rgba(255,255,255,0.2);
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .header.no-creator .card-creator {
            display: none !important;
        }
        .header.no-creator .card-title {
            font-size: 78px !important; 
        }

        .card-title {
            font-family: "Pusab", "Arial Black", sans-serif;
            font-size: 60px;
            letter-spacing: 1px;
            line-height: 1;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            white-space: nowrap; 
            display: inline-block;
        }

        .card-creator {
            font-family: "Montserrat", sans-serif;
            font-size: 24px;
            line-height: 1;
            margin: 0;
            margin-top: -4px;
            white-space: nowrap;
            display: inline-block;
        }

        .art {
            height: 530px;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #FFFFFF;
            box-shadow: 0px 6px 15px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        .art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.15);
        }

        .description-box {
            background: linear-gradient(to bottom, rgba(15,15,15,0.6), rgba(25,25,25,0.6));
            backdrop-filter: brightness(1.2) blur(3px);
            -webkit-backdrop-filter: brightness(1.2) blur(3px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            padding: 0 25px; 
            height: 407px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0px 4px 10px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        .desc-content-wrapper {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
            align-items: center;
            width: 721px; 
            overflow: hidden;
        }

        .series-header-line {
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            height: 75px;
            width: 100%;
            box-sizing: border-box;
            color: #dddddd;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .series-text {
            font-family: "Montserrat", sans-serif;
            font-size: 28px;
            text-align: center;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.9);
            display: inline-block;
            white-space: nowrap; 
        }

        .description-text {
            font-family: "Montserrat", sans-serif;
            color: #FFFFFF;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.9);
            font-size: 40px;
            padding: 0;
            margin: 0;
            text-align: center;
            font-style: italic;
            
            /* GHOST LINE FIX: width restricted to provide buffer against 2x scale reflowing */
            width: 700px; 
            line-height: 1.25; 
            white-space: pre-line; 
            overflow-wrap: break-word;
        }

        .card-footer-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            height: 75px;
            color: #dddddd;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            box-sizing: border-box;
            margin-top: auto;
        }

        .card-footer-line span {
            display: inline-block; 
        }

        .footer-normal { font-size: 28px; }
        .footer-foil { font-size: 20px; display: none; }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-direction: row;
        }

        .rnbw {
            background-image: linear-gradient(80deg, rgb(255, 100, 100), rgb(255, 217, 0), rgb(0, 255, 128), rgb(0, 191, 255), rgb(255, 0, 255));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-size: 28px;
            font-weight: 1000;
        }

        .holo-foil {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 8;
            pointer-events: none;
            mix-blend-mode: overlay;
            opacity: 1;
            background: 
                linear-gradient(80deg, transparent 10%, rgba(255,255,255, 0.9) 35%, rgba(255,255,255, 0.9) 25%, transparent 50%),
                linear-gradient(80deg, rgba(255, 100, 100, 1), rgba(255, 215, 0, 1), rgba(0, 255, 128, 1), rgba(0, 191, 255, 1), rgba(255, 0, 255, 1)),
                url("holo.png"); 
            background-size: 100% 100%, 100% 100%, cover;
            background-blend-mode: normal, screen, normal;
            filter: saturate(250%);
            display: none; 
        }

        [class^="rarity-"] {
            position: relative;
            z-index: 1;
            font-family: "Montserrat", sans-serif;
            font-weight: 700;
            font-size: 28px;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.3);
        }

        [class^="rarity-"]::before {
            content: attr(data-text); 
            position: absolute;
            left: 0; top: 0; z-index: -1;
            -webkit-text-stroke: 2px CurrentColor;
            -webkit-filter: brightness(0.5);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        .rarity-common { color: #ffffff; }
        .rarity-uncommon { color: #66ff66; }
        .rarity-rare { color: #4488ff; }
        .rarity-epic { color: #bf59ff; }
        .rarity-legendary { color: #ffcc00; font-weight: bold; }
        .rarity-mythic { color: #ff3333; font-weight: bold; }
        .rarity-heavenly { color: #86fcb8; font-weight: bold; }
    </style>
</head>
<body>

    <div class="controls" id="main-controls">
        
        <!-- PC Column 1 -->
        <div class="control-col">
            <div class="input-group">
                <label id="label-art-id">Level ID:</label>
                <label id="label-art-url" style="display: none;">Image URL:</label>
                <div class="input-row">
                    <input type="text" id="input-id" value="000000000" oninput="updateCard()">
                    <input type="text" id="input-url" style="display: none;" placeholder="https://..." oninput="updateCard()">
                    <button class="btn-clear-field" onclick="clearField('input-id'); clearField('input-url');" title="Clear Field">X</button>
                    <div class="hide-box"><input type="checkbox" id="hide-art" onchange="updateCard()"></div>
                </div>
            </div>
            
            <div class="input-group">
                <label>Description:</label>
                <div class="input-row">
                    <input type="text" id="input-desc" value="CARDTEXT" oninput="updateCard()">
                    <button class="btn-clear-field" onclick="clearField('input-desc')" title="Clear Field">X</button>
                    <div class="hide-box"><input type="checkbox" id="hide-desc" onchange="updateCard()"></div>
                </div>
            </div>
        </div>

        <!-- PC Column 2 -->
        <div class="control-col">
            <div class="input-group">
                <label>Level Name:</label>
                <div class="input-row">
                    <input type="text" id="input-name" value="LVLNAME" oninput="updateCard()">
                    <button class="btn-clear-field" onclick="clearField('input-name')" title="Clear Field">X</button>
                    <div class="hide-box"><input type="checkbox" id="hide-name" onchange="updateCard()"></div>
                </div>
            </div>
            
            <div class="input-group">
                <label>Series:</label>
                <div class="input-row">
                    <input type="text" id="input-series" value="Release Pack #1" oninput="updateCard()">
                    <button class="btn-clear-field" onclick="clearField('input-series')" title="Clear Field">X</button>
                    <div class="hide-box"><input type="checkbox" id="hide-series" onchange="updateCard()"></div>
                </div>
            </div>
        </div>

        <!-- PC Column 3 -->
        <div class="control-col">
            <div class="input-group">
                <label>Creator Name:</label>
                <div class="input-row">
                    <input type="text" id="input-creator" value="LVLCREATOR" oninput="updateCard()">
                    <button class="btn-clear-field" onclick="clearField('input-creator')" title="Clear Field">X</button>
                    <div class="hide-box"><input type="checkbox" id="hide-creator" onchange="updateCard()"></div>
                </div>
            </div>
            
            <div class="input-group">
                <label>Rarity:</label>
                <div class="input-row">
                    <select id="input-rarity" onchange="updateCard()">
                        <option value="common">Common</option>
                        <option value="uncommon">Uncommon</option>
                        <option value="rare">Rare</option>
                        <option value="epic">Epic</option>
                        <option value="legendary">Legendary</option>
                        <option value="mythic" selected>Mythic</option>
                        <option value="heavenly">Heavenly</option>
                    </select>
                    <button class="btn-clear-field" onclick="clearField('input-rarity')" title="Clear Field">X</button>
                    <div class="hide-box"><input type="checkbox" id="hide-rarity" onchange="updateCard()"></div>
                </div>
            </div>
        </div>

        <!-- PC Column 4 (Toggles & Settings) -->
        <div class="control-col col-toggles">
            <div class="toggle-item">
                <label for="input-foil">RNBW:</label>
                <input type="checkbox" id="input-foil" onchange="updateCard()">
            </div>
            <div class="toggle-item">
                <label for="input-use-url">URL:</label>
                <input type="checkbox" id="input-use-url" onchange="toggleInputMode()">
            </div>
        </div>

        <!-- PC Column 5 (Actions) -->
        <div class="control-col col-actions">
            <!-- Format & Batch Output Config -->
            <div style="display: flex; gap: 8px; width: 100%;">
                <div class="input-group" style="flex: 1; margin: 0;">
                    <label style="margin-top:0; font-size: 11px;">Format:</label>
                    <select id="input-format" style="width:100%; height:32px; font-size:12px; background:#333; color:white; border:1px solid #555; border-radius:4px;">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                        <option value="webp">WEBP</option>
                    </select>
                </div>
                <div class="input-group" style="flex: 1; margin: 0;">
                    <label style="margin-top:0; font-size: 11px;">Batch Output:</label>
                    <select id="input-batch-mode" style="width:100%; height:32px; font-size:12px; background:#333; color:white; border:1px solid #555; border-radius:4px;">
                        <option value="zip">ZIP File</option>
                        <option value="individual">Individual</option>
                    </select>
                </div>
            </div>

            <button class="btn-dl" id="dl-btn" onclick="triggerDownload()">Download Card</button>
            <div class="action-row">
                <button class="btn-import" onclick="openJsonModal()">JSON</button>
                <button class="btn-clear" onclick="clearAllInputs()">Clear</button>
            </div>
            <div id="overflow-warning">⚠️ Warning: Text exceeds boundaries.</div>
        </div>

    </div>

    <!-- JSON Import Modal -->
    <div id="json-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Import Card Data</h3>
            <textarea id="json-input" rows="12" placeholder='Paste a single JSON object or a JSON array [ {...}, {...} ] for batch rendering.'></textarea>
            <div class="modal-buttons">
                <button class="btn-modal-submit" onclick="submitJson()">Submit</button>
                <button class="btn-modal-cancel" onclick="closeJsonModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="card-wrapper">
        <div class="card" id="trading-card">
            <div class="card-bg" id="card-bg" style="background-image: url('https://levelthumbs.prevter.me/thumbnail/000000000'); --seed: 000000000;"></div>
            <div class="holo-foil" id="card-holo"></div>
            
            <div class="header">
                <span class="card-title" id="card-name">LVLNAME</span>
                <span class="card-creator" id="card-creator">By LVLCREATOR</span>
            </div>
            
            <div class="art">
                <img src="https://levelthumbs.prevter.me/thumbnail/000000000" id="card-art" alt="Card Art" crossorigin="anonymous" />
            </div>
            
            <div class="description-box">
                
                <div class="series-header-line" id="series-container">
                    <span class="series-text" id="card-series">Release Pack #1</span>
                </div>

                <div class="desc-content-wrapper" id="desc-wrapper">
                    <div class="description-text" id="card-desc">CARDTEXT</div>
                </div>
                
                <div class="card-footer-line footer-normal" id="footer-normal">
                    <span id="footer-jolly">Jolly's Level Cards</span>
                    <span class="rarity-mythic card-rarity" data-text="Mythic" id="footer-rarity">Mythic</span>
                </div>

                <div class="card-footer-line footer-foil" id="footer-foil">
                    <span id="footer-foil-jolly">JOLLY'S LEVEL CARDS</span>
                    <div class="footer-right">
                        <span class="rarity-mythic card-rarity" data-text="Mythic" id="footer-foil-rarity">Mythic</span>
                        <span id="footer-foil-amp">&</span>
                        <span class="rnbw" id="footer-foil-rnbw">RNBW</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // URL API RECONSTRUCTOR (Fixes the '#' fragmentation bug)
        // -------------------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            const rawParamString = window.location.search + window.location.hash;
            
            if (rawParamString.includes('json=')) {
                try {
                    let jsonRaw = rawParamString.substring(rawParamString.indexOf('json=') + 5);
                    let decodedJson = jsonRaw;
                    
                    try {
                        decodedJson = decodeURIComponent(jsonRaw);
                    } catch (e) {
                        console.warn("JSON was not URI encoded, falling back to raw parse.");
                    }
                    
                    const data = JSON.parse(decodedJson);
                    
                    if (Array.isArray(data)) {
                        processBatch(data, true); 
                    } else {
                        document.getElementById('main-controls').style.display = 'none';
                        document.body.style.justifyContent = 'center';

                        applyJsonData(data);
                        setTimeout(() => {
                            generateCardDataUrl(data["LvL-NM"] || 'card').then(result => {
                                triggerFileDownload(result.url, result.filename);
                                setTimeout(() => { window.close(); }, 2500); 
                            }).catch(e => console.error(e));
                        }, 1000); 
                    }
                } catch (e) {
                    console.error("Failed to parse automated URL JSON:", e);
                    alert("API Error: The JSON provided in the URL is malformed or invalid.");
                }
            }
        });

        // -------------------------------------------------------------
        // DYNAMIC PIXEL CENTERING ALGORITHM (2-AXIS)
        // -------------------------------------------------------------
        function pixelCenterElement(el, applyY = true, applyX = true) {
            if (!el || el.innerText.trim() === '' || window.getComputedStyle(el).display === 'none') return;
            el.style.transform = 'translate(0px, 0px)'; 
            
            const compStyle = window.getComputedStyle(el);
            const fontString = `${compStyle.fontWeight} ${compStyle.fontSize} ${compStyle.fontFamily}`;
            const fontSize = parseFloat(compStyle.fontSize);
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            canvas.width = 1200;
            canvas.height = Math.ceil(fontSize * 4); 
            const drawX = 600;
            const drawY = Math.ceil(fontSize * 1.5); 
            
            ctx.font = fontString;
            ctx.textBaseline = 'middle'; 
            ctx.textAlign = 'center';    
            ctx.fillStyle = 'white';
            ctx.fillText(el.innerText, drawX, drawY);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            let top = -1, bottom = -1, left = -1, right = -1;
            
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const alpha = data[(y * canvas.width + x) * 4 + 3];
                    if (alpha > 10) { 
                        if (top === -1) top = y;
                        bottom = y;
                        if (left === -1 || x < left) left = x;
                        if (x > right) right = x;
                    }
                }
            }
            
            if (top !== -1) {
                let offsetX = 0;
                let offsetY = 0;

                if (applyY) {
                    const visualCenterY = top + (bottom - top) / 2;
                    offsetY = drawY - visualCenterY;
                    offsetY = Math.round(offsetY * 10) / 10;
                }
                if (applyX) {
                    const visualCenterX = left + (right - left) / 2;
                    offsetX = drawX - visualCenterX;
                    offsetX = Math.round(offsetX * 10) / 10;
                }

                el.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            }
        }

        // -------------------------------------------------------------
        // BATCH RENDERING SYSTEM (ZIP & Individual Support)
        // -------------------------------------------------------------
        async function processBatch(arr, isAuto = false) {
            document.getElementById('main-controls').style.display = 'none';
            document.body.style.justifyContent = 'center';
            
            let statusText = document.getElementById('api-status-text');
            if(!statusText) {
                statusText = document.createElement('h2');
                statusText.id = 'api-status-text';
                statusText.style.color = '#00ff66';
                statusText.style.position = 'absolute';
                statusText.style.top = '20px';
                statusText.style.fontFamily = '"Montserrat", sans-serif';
                document.body.appendChild(statusText);
            }

            const batchMode = document.getElementById('input-batch-mode').value;
            let zip = null;
            if (batchMode === 'zip') {
                zip = new JSZip();
            }

            for (let i = 0; i < arr.length; i++) {
                statusText.innerText = `Batch Processing: Rendering Card ${i + 1} of ${arr.length}...`;
                applyJsonData(arr[i]);
                
                await new Promise(r => setTimeout(r, 800)); 
                
                try {
                    const result = await generateCardDataUrl(arr[i]["LvL-NM"] || `card_${i+1}`);
                    
                    if (batchMode === 'zip') {
                        const base64Data = result.url.split(',')[1];
                        zip.file(result.filename, base64Data, {base64: true});
                    } else {
                        triggerFileDownload(result.url, result.filename);
                        await new Promise(r => setTimeout(r, 600)); 
                    }
                } catch (e) {
                    console.error(`Failed to export card ${i+1}`, e);
                }
            }
            
            if (batchMode === 'zip') {
                statusText.innerText = `Compressing ${arr.length} cards into ZIP file...`;
                const zipBlob = await zip.generateAsync({type: "blob"});
                const zipUrl = URL.createObjectURL(zipBlob);
                triggerFileDownload(zipUrl, "Batch_Export.zip");
                setTimeout(() => URL.revokeObjectURL(zipUrl), 10000);
            }

            statusText.innerText = `Batch Complete! Processed ${arr.length} cards.`;
            
            if (isAuto) {
                statusText.innerText += ' Tab closing in 2.5 seconds.';
                setTimeout(() => window.close(), 2500);
            } else {
                setTimeout(() => {
                    document.getElementById('main-controls').style.display = 'flex';
                    document.body.style.justifyContent = 'flex-start';
                    if(statusText) statusText.remove();
                }, 3000);
            }
        }

        function openJsonModal() {
            const jsonInput = document.getElementById('json-input');
            jsonInput.value = '';
            document.getElementById('json-modal').style.display = 'flex';
            setTimeout(() => { jsonInput.focus(); }, 50);
        }

        function closeJsonModal() {
            document.getElementById('json-modal').style.display = 'none';
        }

        function applyJsonData(data) {
            if (!data) return;
            if (data["LvL-UH"] !== undefined) document.getElementById('input-use-url').checked = !!data["LvL-UH"];
            
            const isUrl = document.getElementById('input-use-url').checked;
            if (isUrl) {
                document.getElementById('input-url').value = data["LvL-IM"] || "";
                document.getElementById('input-id').value = ""; 
            } else {
                document.getElementById('input-id').value = data["LvL-IM"] || "";
                document.getElementById('input-url').value = "";
            }

            if (data["LvL-NM"] !== undefined) document.getElementById('input-name').value = data["LvL-NM"];
            if (data["LvL-CR"] !== undefined) document.getElementById('input-creator').value = data["LvL-CR"];
            if (data["LvL-NT"] !== undefined) document.getElementById('input-desc').value = data["LvL-NT"];
            if (data["CrD-RS"] !== undefined) document.getElementById('input-series').value = data["CrD-RS"];
            
            if (data["LvL-RA"]) {
                const r = data["LvL-RA"].toLowerCase();
                const raritySelect = document.getElementById('input-rarity');
                if ([...raritySelect.options].some(opt => opt.value === r)) {
                    raritySelect.value = r;
                }
            }
            if (data["CrD-IF"] !== undefined) document.getElementById('input-foil').checked = !!data["CrD-IF"];

            toggleInputMode(); 
        }

        function submitJson() {
            const jsonText = document.getElementById('json-input').value;
            try {
                const data = JSON.parse(jsonText);
                closeJsonModal();
                if (Array.isArray(data)) {
                    processBatch(data);
                } else {
                    applyJsonData(data);
                }
            } catch (error) {
                alert("Invalid JSON format. Please check your syntax and try again.");
            }
        }

        function toggleInputMode() {
            const useUrl = document.getElementById('input-use-url').checked;
            document.getElementById('input-id').style.display = useUrl ? 'none' : 'block';
            document.getElementById('label-art-id').style.display = useUrl ? 'none' : 'block';
            
            document.getElementById('input-url').style.display = useUrl ? 'block' : 'none';
            document.getElementById('label-art-url').style.display = useUrl ? 'block' : 'none';
            
            updateCard();
        }

        function clearField(fieldId) {
            const field = document.getElementById(fieldId);
            if(field) {
                if(field.tagName === 'SELECT') field.value = 'common'; 
                else field.value = '';
                updateCard();
            }
        }

        function updateCard() {
            const useUrl = document.getElementById('input-use-url').checked;
            const id = document.getElementById('input-id').value;
            const urlInput = document.getElementById('input-url').value;
            
            const name = document.getElementById('input-name').value;
            const creator = document.getElementById('input-creator').value;
            const series = document.getElementById('input-series').value;
            const desc = document.getElementById('input-desc').value;
            const rarity = document.getElementById('input-rarity').value;
            const isFoil = document.getElementById('input-foil').checked;

            const hideArt = document.getElementById('hide-art').checked;
            const hideName = document.getElementById('hide-name').checked;
            const hideCreator = document.getElementById('hide-creator').checked;
            const hideSeries = document.getElementById('hide-series').checked;
            const hideDesc = document.getElementById('hide-desc').checked;
            const hideRarity = document.getElementById('hide-rarity').checked;

            const titleEl = document.getElementById('card-name');
            const creatorEl = document.getElementById('card-creator');

            titleEl.style.fontSize = hideCreator ? '78px' : '60px';
            titleEl.style.transform = 'translate(0, 0)';
            creatorEl.style.fontSize = '24px';
            creatorEl.style.transform = 'translate(0, 0)';

            titleEl.innerText = name || " ";
            creatorEl.innerText = "By " + (creator || " ");
            document.getElementById('card-series').innerText = series || " ";
            document.getElementById('card-desc').innerText = desc || " ";
            
            const formattedRarity = rarity ? (rarity.charAt(0).toUpperCase() + rarity.slice(1)) : 'Common';
            const raritySpans = document.querySelectorAll('.card-rarity');
            raritySpans.forEach(span => {
                span.className = "rarity-" + rarity + " card-rarity";
                span.innerText = formattedRarity;
                span.setAttribute('data-text', formattedRarity); 
            });

            let thumbUrl = useUrl ? urlInput : (id ? `https://levelthumbs.prevter.me/thumbnail/${id}` : '');

            const bgElement = document.getElementById('card-bg');
            bgElement.style.backgroundImage = `url('${thumbUrl}')`;
            bgElement.style.setProperty('--seed', id || 1); 
            document.getElementById('card-art').src = thumbUrl;

            document.getElementById('card-holo').style.display = isFoil ? 'block' : 'none';
            document.getElementById('footer-foil').style.display = isFoil ? 'flex' : 'none';
            document.getElementById('footer-normal').style.display = isFoil ? 'none' : 'flex';

            document.querySelector('.art').style.visibility = hideArt ? 'hidden' : 'visible';
            titleEl.style.visibility = hideName ? 'hidden' : 'visible';
            document.getElementById('card-desc').style.visibility = hideDesc ? 'hidden' : 'visible';
            document.getElementById('series-container').style.display = hideSeries ? 'none' : 'flex';

            const headerElement = document.querySelector('.header');
            if (hideCreator) headerElement.classList.add('no-creator');
            else headerElement.classList.remove('no-creator');
            
            document.querySelectorAll('.card-rarity').forEach(el => el.style.visibility = hideRarity ? 'hidden' : 'visible');
            document.querySelectorAll('.footer-right span:not(.card-rarity)').forEach(el => el.style.visibility = hideRarity ? 'hidden' : 'visible');

            // #05 Auto-Scaling Logic
            const maxTextWidth = 750; 
            
            if (titleEl.offsetWidth > maxTextWidth) {
                const targetSize = hideCreator ? 78 : 60;
                const scale = maxTextWidth / titleEl.offsetWidth;
                titleEl.style.fontSize = Math.floor(targetSize * scale) + 'px';
            }
            if (!hideCreator && creatorEl.offsetWidth > maxTextWidth) {
                const scale = maxTextWidth / creatorEl.offsetWidth;
                creatorEl.style.fontSize = Math.floor(24 * scale) + 'px';
            }

            setTimeout(() => {
                pixelCenterElement(document.getElementById('card-name'));
                pixelCenterElement(document.getElementById('card-creator'));
                pixelCenterElement(document.getElementById('card-series'));
                pixelCenterElement(document.getElementById('footer-jolly'));
                pixelCenterElement(document.getElementById('footer-rarity'));
                pixelCenterElement(document.getElementById('footer-foil-jolly'));
                pixelCenterElement(document.getElementById('footer-foil-rarity'));
                pixelCenterElement(document.getElementById('footer-foil-amp'));
                pixelCenterElement(document.getElementById('footer-foil-rnbw'));
                
                const wrapper = document.getElementById('desc-wrapper');
                const warning = document.getElementById('overflow-warning');
                if (wrapper.scrollHeight > wrapper.clientHeight + 2) warning.style.display = 'block';
                else warning.style.display = 'none';
            }, 10);
        }
        
        function clearAllInputs() {
            document.getElementById('input-use-url').checked = false;
            document.getElementById('input-id').value = '';
            document.getElementById('input-url').value = '';
            document.getElementById('input-name').value = '';
            document.getElementById('input-creator').value = '';
            document.getElementById('input-series').value = '';
            document.getElementById('input-desc').value = '';
            document.getElementById('input-rarity').value = 'common';
            document.getElementById('input-foil').checked = false;
            document.getElementById('input-format').value = 'png';
            document.getElementById('input-batch-mode').value = 'zip';

            document.getElementById('hide-art').checked = false;
            document.getElementById('hide-name').checked = false;
            document.getElementById('hide-creator').checked = false;
            document.getElementById('hide-series').checked = false;
            document.getElementById('hide-desc').checked = false;
            document.getElementById('hide-rarity').checked = false;

            toggleInputMode(); 
        }

        function triggerDownload() {
            const btn = document.getElementById('dl-btn');
            btn.innerText = "Rendering...";
            btn.disabled = true;

            const filename = document.getElementById('input-name').value || 'card';
            generateCardDataUrl(filename).then(result => {
                triggerFileDownload(result.url, result.filename);
                btn.innerText = "Download Card";
                btn.disabled = false;
            }).catch(e => {
                alert("Export failed: " + e);
                btn.innerText = "Download Card";
                btn.disabled = false;
            });
        }

        function triggerFileDownload(url, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function generateCardDataUrl(baseFilename) {
            return new Promise((resolve, reject) => {
                const cardElement = document.getElementById('trading-card');
                const wrapper = document.querySelector('.card-wrapper');
                const format = document.getElementById('input-format').value;

                document.fonts.ready.then(() => {
                    const originalTransform = wrapper.style.transform;
                    const originalHeight = wrapper.style.height;

                    wrapper.style.transform = 'scale(1)';
                    wrapper.style.height = '1125px';

                    setTimeout(async () => {
                        try {
                            const ext = (format === 'jpeg') ? 'jpg' : format;
                            const filename = `${baseFilename}.${ext}`;
                            let dataUrl = "";

                            if (format === 'png') {
                                dataUrl = await htmlToImage.toPng(cardElement, { quality: 1.0, pixelRatio: 2, width: 825, height: 1125 });
                            } else if (format === 'jpeg') {
                                dataUrl = await htmlToImage.toJpeg(cardElement, { quality: 0.95, pixelRatio: 2, width: 825, height: 1125, backgroundColor: '#000000' });
                            } else if (format === 'webp') {
                                const canvas = await htmlToImage.toCanvas(cardElement, { pixelRatio: 2, width: 825, height: 1125, backgroundColor: '#000000' });
                                dataUrl = canvas.toDataURL('image/webp', 1.0);
                            }
                            
                            wrapper.style.transform = originalTransform;
                            wrapper.style.height = originalHeight;
                            
                            resolve({ url: dataUrl, filename: filename });

                        } catch (error) {
                            wrapper.style.transform = originalTransform;
                            wrapper.style.height = originalHeight;
                            reject(error);
                        }
                    }, 150); 
                });
            });
        }
    </script>
</body>
</html>
